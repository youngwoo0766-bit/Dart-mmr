<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 다트 커피내기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0e17;color:#fffffe;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;min-height:100vh;padding-bottom:80px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.header{background:linear-gradient(135deg,#1a1929,#22203a);border-bottom:1px solid #2e2c4a;padding:20px;position:sticky;top:0;z-index:100}
.header-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.htitle{font-size:20px;font-weight:900}
.hsub{font-size:11px;color:#a7a9be;margin-top:1px}
.sbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.spin{width:16px;height:16px;border:3px solid rgba(255,107,53,0.3);border-top:3px solid #ff6b35;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
.con{max-width:480px;margin:0 auto;padding:0 16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0;background:#1a1929;border-radius:12px;padding:4px}
.tb{border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500;padding:8px 4px;font-size:12px;background:transparent;color:#a7a9be;transition:all 0.18s}
.tb.on{background:#ff6b35;color:#fff;font-weight:800}
.sbar{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:8px 14px;margin-bottom:12px}
.sbar span{font-size:12px;font-weight:700}
.sbtn{border:none;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:700;padding:4px 12px;font-size:11px;display:none}
.card{background:#22203a;border:1px solid #2e2c4a;border-radius:14px;padding:16px;margin-bottom:12px;animation:fadeIn 0.2s ease}
.ctitle{font-size:13px;font-weight:700;margin-bottom:10px}
.rcard{background:#22203a;border:1px solid #2e2c4a;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.rnum{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
.rinfo{flex:1}
.rnrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rname{font-weight:800;font-size:16px}
.tbadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.rstats{font-size:11px;color:#a7a9be;margin-top:4px}
.bbar{margin-top:6px;height:4px;background:#2e2c4a;border-radius:4px;overflow:hidden}
.bfill{height:100%;border-radius:4px}
.rmmr{text-align:right;flex-shrink:0}
.rmmrv{font-size:22px;font-weight:900}
.rmmrl{font-size:10px;color:#a7a9be}
.mttgl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.mtbtn{border:1px solid #2e2c4a;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;padding:10px;font-size:13px;background:#1a1929;color:#a7a9be;transition:all 0.18s}
.mtbtn.on{background:#ff6b35;color:#fff;border-color:#ff6b35}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;padding:8px 16px;font-size:14px;border:1px solid #2e2c4a;background:#1a1929;color:#a7a9be;transition:all 0.18s}
.mbtn.on{background:#ff6b35;color:#fff;border-color:#ff6b35}
.tcbtns{display:flex;gap:8px;flex-wrap:wrap}
.tcbtn{border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;padding:8px 16px;font-size:14px;border:1px solid #2e2c4a;background:#1a1929;color:#a7a9be;transition:all 0.18s}
.tcbtn.on{border-color:#a78bfa;background:rgba(167,139,250,0.15);color:#a78bfa}
.pitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:6px;background:#1a1929;border:1px solid #2e2c4a;cursor:pointer;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.pitem:active{opacity:0.7}
.chk{width:22px;height:22px;border-radius:6px;background:#2e2c4a;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:900;color:#fff}
.sic{background:#1a1929;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ilbl{font-size:11px;color:#a7a9be;margin-bottom:4px}
input[type=number],input[type=text]{width:100%;padding:10px;background:#22203a;border:1px solid #2e2c4a;border-radius:8px;color:#fffffe;font-size:16px;font-family:inherit;outline:none;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus{border-color:#ff6b35}
.btn{border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;transition:all 0.18s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(0.97)}
.btnp{background:linear-gradient(135deg,#ff6b35,#ff8c42);color:#fff;padding:14px;width:100%}
.btns{background:#1a1929;color:#a7a9be;border:1px solid #2e2c4a;padding:14px}
.btna{background:#ff6b35;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;border:none;cursor:pointer;font-family:inherit;font-weight:700}
.brow{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.done-card{background:#22203a;border:1px solid rgba(0,230,118,0.27);border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;animation:fadeIn 0.3s ease}
.drow{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#1a1929;border-radius:8px;margin-bottom:6px;font-size:13px;gap:8px}
.pcard{background:#22203a;border:1px solid #2e2c4a;border-radius:12px;padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.pinfo{flex:1}
.pname{font-weight:800}
.pstat{font-size:11px;color:#a7a9be;margin-top:2px}
.pmmr{text-align:right;margin-right:8px}
.pmmrv{font-weight:900}
.pmmrt{font-size:10px;padding:1px 6px;border-radius:10px;margin-top:2px}
.delbtn{border:none;background:rgba(255,68,68,0.15);color:#ff4444;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:700;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.hcard{background:#22203a;border:1px solid #2e2c4a;border-radius:14px;padding:16px;margin-bottom:12px}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:4px}
.hmode{background:rgba(255,107,53,0.2);color:#ff6b35;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #2e2c4a}
.tbdg{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;padding:10px 22px;border-radius:30px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.4);white-space:nowrap;pointer-events:none;display:none}
.empty{text-align:center;color:#a7a9be;padding:50px 20px;font-size:14px}
.loading{text-align:center;padding:40px 0;color:#a7a9be}
.lspin{width:32px;height:32px;border:3px solid rgba(255,107,53,0.3);border-top:3px solid #ff6b35;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
.ainrow{display:flex;gap:8px}
.ainput{flex:1;padding:10px 14px;background:#1a1929;border:1px solid #2e2c4a;border-radius:10px;color:#fffffe;font-size:15px;font-family:inherit;outline:none}
.ainput:focus{border-color:#ff6b35}
.ahint{font-size:11px;color:#a7a9be;margin-top:8px}
.hintbox{background:#1a1929;border-radius:10px;padding:10px 14px;font-size:12px;color:#a7a9be;margin-bottom:10px;border:1px solid #2e2c4a;line-height:1.7}
.tpgrid{display:grid;gap:8px;margin-bottom:6px}
.tbox{background:#1a1929;border-radius:10px;padding:10px 12px;border:2px solid #2e2c4a}
.tbtitle{font-size:12px;font-weight:800;margin-bottom:6px}
.tchip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;margin:2px}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:28px">🎯</span>
      <div><div class="htitle">다트 커피내기</div><div class="hsub">MMR 랭킹 시스템</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="spin" id="hSpin"></div>
      <div class="sbadge" id="sBadge" style="color:#4a9eff;background:rgba(74,158,255,0.15)">연결 중</div>
    </div>
  </div>
</div>

<div class="con">
  <div class="tabs">
    <button class="tb on" id="tb-ranking">🏆 랭킹</button>
    <button class="tb" id="tb-game">🎯 게임</button>
    <button class="tb" id="tb-players">👤 선수</button>
    <button class="tb" id="tb-history">📋 기록</button>
  </div>
  <div class="sbar" id="sBar" style="background:rgba(74,158,255,0.1)">
    <span id="sBarTxt" style="color:#4a9eff">🔄 Firebase 연결 중...</span>
    <button class="sbtn" id="sBarBtn">새로고침</button>
  </div>
  <div id="loadView" class="loading"><div class="lspin"></div><div>데이터 불러오는 중...</div></div>
  <div id="main" style="display:none">

    <!-- 랭킹 -->
    <div id="tab-ranking">
      <div style="font-size:13px;color:#a7a9be;margin-bottom:12px" id="rankMeta"></div>
      <div id="rankList"></div>
    </div>

    <!-- 게임 -->
    <div id="tab-game" style="display:none">
      <div id="vSelect">
        <div class="mttgl">
          <button class="mtbtn on" id="btnSolo">👤 개인전</button>
          <button class="mtbtn" id="btnTeam">👥 팀전</button>
        </div>
        <div class="card">
          <div class="ctitle">🎮 게임 모드</div>
          <div class="mbtns" id="modeBtns"></div>
        </div>
        <div id="teamOpts" style="display:none">
          <div class="card">
            <div class="ctitle">🔢 팀 수</div>
            <div class="tcbtns" id="tcBtns"></div>
          </div>
        </div>
        <div class="card">
          <div class="ctitle" id="pSelTitle">👤 참가 선수 선택 (2명 이상)</div>
          <div id="pSelList"></div>
        </div>
        <div class="card" id="tPreviewCard" style="display:none">
          <div class="ctitle">🔀 팀 배정 현황</div>
          <div id="tPreviewGrid" class="tpgrid"></div>
          <div style="font-size:11px;color:#a7a9be;margin-top:4px">누를 때마다 팀 순환 · 한 번 더 누르면 해제</div>
        </div>
        <button class="btn btnp" id="btnStart">게임 시작 🎯</button>
      </div>
      <div id="vScore" style="display:none">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div style="font-weight:800;font-size:16px">📝 점수 입력</div>
            <span id="scoreLabel" style="background:rgba(255,107,53,0.2);color:#ff6b35;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700"></span>
          </div>
          <div id="scoreInputs"></div>
        </div>
        <div class="brow">
          <button class="btn btns" id="btnCancel">취소</button>
          <button class="btn btnp" id="btnSubmit">MMR 반영 ✓</button>
        </div>
      </div>
      <div id="vDone" style="display:none">
        <div class="done-card">
          <div style="font-size:36px;margin-bottom:8px">✅</div>
          <div id="doneWin" style="font-weight:900;font-size:20px;margin-bottom:8px;display:none"></div>
          <div style="font-weight:800;font-size:16px;margin-bottom:4px">기록 완료!</div>
          <div style="color:#a7a9be;font-size:13px;margin-bottom:16px">MMR 업데이트 · Firebase 저장됨 🔥</div>
          <div id="doneRows"></div>
          <button class="btn btnp" id="btnNewGame" style="margin-top:12px;width:auto;padding:10px 28px;font-size:14px">새 게임 시작</button>
        </div>
      </div>
    </div>

    <!-- 선수 -->
    <div id="tab-players" style="display:none">
      <div class="card">
        <div class="ctitle">➕ 새 선수 등록</div>
        <div class="ainrow">
          <input class="ainput" type="text" id="newName" placeholder="이름 입력">
          <button class="btna" id="btnAdd">등록</button>
        </div>
        <div class="ahint">신규 등록 시 MMR 1000점 시작 · Firebase 자동 저장 🔥</div>
      </div>
      <div id="pList"></div>
    </div>

    <!-- 기록 -->
    <div id="tab-history" style="display:none">
      <div id="hList"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:'https://dart-mmr-default-rtdb.asia-southeast1.firebasedatabase.app/'});
var db = firebase.database();

var TEAMS = [
  {n:'A',c:'#4a9eff',bg:'rgba(74,158,255,0.15)',e:'🔵'},
  {n:'B',c:'#ff6b35',bg:'rgba(255,107,53,0.15)', e:'🔴'},
  {n:'C',c:'#00e676',bg:'rgba(0,230,118,0.15)',  e:'🟢'},
  {n:'D',c:'#ffd700',bg:'rgba(255,215,0,0.15)',  e:'🟡'},
  {n:'E',c:'#a78bfa',bg:'rgba(167,139,250,0.15)',e:'🟣'},
  {n:'F',c:'#f472b6',bg:'rgba(244,114,182,0.15)',e:'🩷'},
];
var TIERS = [
  {name:'챌린저',min:1800,color:'#ff6b35',icon:'👑'},
  {name:'다이아', min:1500,color:'#00cfff',icon:'💎'},
  {name:'플래티넘',min:1300,color:'#00e676',icon:'🏆'},
  {name:'골드',   min:1100,color:'#ffd700',icon:'🥇'},
  {name:'실버',   min:900, color:'#c0c0c0',icon:'🥈'},
  {name:'브론즈', min:0,   color:'#cd7f32',icon:'🥉'},
];
var MODES = ['301','501','701','Cricket'];
function tier(mmr){return TIERS.find(function(t){return mmr>=t.min;})||TIERS[5];}

// 상태
var players=[], history=[], curTab='ranking';
var matchType='solo', teamCount=2, teamMap={}, selPlayers=[], gameMode='501';

// ── Firebase ──────────────────────────────────────────────────
function savePlayers(){
  var o={};players.forEach(function(p){o[p.id]=p;});
  return db.ref('players').set(o);
}
function saveHist(r){return db.ref('history').push(r);}

function loadData(){
  syncUI('syncing');
  document.getElementById('loadView').style.display='block';
  document.getElementById('main').style.display='none';
  Promise.all([db.ref('players').once('value'),db.ref('history').once('value')])
  .then(function(s){
    players=s[0].exists()?Object.values(s[0].val()).map(function(p){
      return {id:String(p.id),name:p.name,mmr:Number(p.mmr),games:Number(p.games),wins:Number(p.wins)};
    }):[];
    history=s[1].exists()?Object.values(s[1].val()).reverse():[];
    syncUI('ok'); renderAll(); toast('데이터 로드 완료! 🔥','#00e676');
  }).catch(function(){syncUI('err');toast('Firebase 연결 실패!','#ff4444');})
  .finally(function(){
    document.getElementById('loadView').style.display='none';
    document.getElementById('main').style.display='block';
  });
}

// ── Sync UI ───────────────────────────────────────────────────
function syncUI(s){
  var m={
    ok: {bc:'#00e676',bb:'rgba(0,230,118,0.15)',bt:'Firebase 연동',bg:'rgba(0,230,118,0.1)',tc:'#00e676',tt:'✅ Firebase 연결됨',showBtn:false,spin:false},
    syncing:{bc:'#4a9eff',bb:'rgba(74,158,255,0.15)',bt:'동기화 중',bg:'rgba(74,158,255,0.1)',tc:'#4a9eff',tt:'🔄 동기화 중...',showBtn:false,spin:true},
    err:{bc:'#ff4444',bb:'rgba(255,68,68,0.15)',bt:'연결 오류',bg:'rgba(255,68,68,0.1)',tc:'#ff4444',tt:'⚠️ 연결 실패',showBtn:true,spin:false},
  }[s]||{};
  el('sBadge').style.color=m.bc;el('sBadge').style.background=m.bb;el('sBadge').textContent=m.bt;
  el('sBar').style.background=m.bg;el('sBarTxt').style.color=m.tc;el('sBarTxt').textContent=m.tt;
  el('sBarBtn').style.display=m.showBtn?'block':'none';
  el('hSpin').style.display=m.spin?'block':'none';
}

// ── 탭 ───────────────────────────────────────────────────────
function el(id){return document.getElementById(id);}
function showTab(t){
  ['ranking','game','players','history'].forEach(function(x){
    el('tb-'+x).classList.toggle('on',x===t);
    el('tab-'+x).style.display=x===t?'block':'none';
  });
  curTab=t; renderTab(t);
}
function renderAll(){renderTab(curTab);}
function renderTab(t){
  if(t==='ranking') renderRanking();
  if(t==='game')    renderSelect();
  if(t==='players') renderPlayers();
  if(t==='history') renderHistory();
}

// ── 탭 버튼 이벤트 ────────────────────────────────────────────
['ranking','game','players','history'].forEach(function(t){
  el('tb-'+t).addEventListener('click',function(){showTab(t);});
});
el('sBarBtn').addEventListener('click',loadData);

// ── 랭킹 ─────────────────────────────────────────────────────
function renderRanking(){
  var sorted=players.slice().sort(function(a,b){return b.mmr-a.mmr;});
  el('rankMeta').textContent='총 '+players.length+'명 · 게임 '+history.length+'판';
  var list=el('rankList');
  if(!sorted.length){list.innerHTML='<div class="empty">👤<br><br>선수 탭에서 등록해주세요</div>';return;}
  list.innerHTML='';
  sorted.forEach(function(p,i){
    var t=tier(p.mmr), wr=p.games>0?Math.round(p.wins/p.games*100):0;
    var nb=i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'#1a1929', nc=i<3?'#000':'#a7a9be';
    var d=document.createElement('div');
    d.className='rcard';
    if(i===0) d.style.cssText='background:linear-gradient(135deg,#2a1f0a,#22203a);border-color:#ffd700';
    d.innerHTML='<div class="rnum" style="background:'+nb+';color:'+nc+'">'+(i+1)+'</div>'
      +'<div class="rinfo">'
        +'<div class="rnrow"><span class="rname">'+p.name+'</span><span>'+t.icon+'</span>'
          +'<span class="tbadge" style="color:'+t.color+';background:'+t.color+'22">'+t.name+'</span></div>'
        +'<div class="rstats">'+p.games+'전 '+p.wins+'승 · 승률 '+wr+'%</div>'
        +'<div class="bbar"><div class="bfill" style="width:'+Math.min(100,p.mmr/2000*100)+'%;background:linear-gradient(90deg,'+t.color+',#ff6b35)"></div></div>'
      +'</div>'
      +'<div class="rmmr"><div class="rmmrv" style="color:'+t.color+'">'+p.mmr+'</div><div class="rmmrl">MMR</div></div>';
    list.appendChild(d);
  });
}

// ── 게임 선택 ─────────────────────────────────────────────────
function renderSelect(){
  // 모드 버튼
  var mb=el('modeBtns');mb.innerHTML='';
  MODES.forEach(function(m){
    var b=document.createElement('button');
    b.className='mbtn'+(m===gameMode?' on':'');b.textContent=m;
    b.addEventListener('click',function(){gameMode=m;renderSelect();});
    mb.appendChild(b);
  });
  // 팀 수 버튼
  if(matchType==='team'){
    var tc=el('tcBtns');tc.innerHTML='';
    [2,3,4,5,6].forEach(function(n){
      var b=document.createElement('button');
      b.className='tcbtn'+(n===teamCount?' on':'');b.textContent=n+'팀';
      b.addEventListener('click',function(){teamCount=n;teamMap={};renderSelect();});
      tc.appendChild(b);
    });
  }
  // 선수 목록
  var sl=el('pSelList');sl.innerHTML='';
  if(!players.length){
    sl.innerHTML='<div style="color:#a7a9be;font-size:13px;text-align:center;padding:16px 0">선수 탭에서 먼저 등록해주세요</div>';
    return;
  }
  players.forEach(function(p){
    var d=document.createElement('div');
    d.className='pitem';
    if(matchType==='solo'){
      var sel=selPlayers.indexOf(p.id)>=0;
      var t=tier(p.mmr);
      if(sel) d.style.cssText='background:rgba(255,107,53,0.13);border-color:#ff6b35';
      d.innerHTML='<div class="chk" style="background:'+(sel?'#ff6b35':'#2e2c4a')+'">'+(sel?'✓':'')+'</div>'
        +'<span style="font-weight:700;flex:1">'+p.name+'</span>'
        +'<span style="font-size:12px;color:'+t.color+'">'+t.icon+' '+p.mmr+'</span>';
      d.addEventListener('click',function(){
        var idx=selPlayers.indexOf(p.id);
        if(idx>=0)selPlayers.splice(idx,1);else selPlayers.push(p.id);
        renderSelect();
      });
    } else {
      var tName=teamMap[p.id];
      var tc2=tName?TEAMS.find(function(t){return t.n===tName;}):null;
      var t2=tier(p.mmr);
      if(tc2) d.style.cssText='background:'+tc2.bg+';border-color:'+tc2.c;
      d.innerHTML='<div class="chk" style="background:'+(tc2?tc2.c:'#2e2c4a')+'">'+(tc2?tc2.n:'')+'</div>'
        +'<span style="font-weight:700;flex:1">'+p.name+'</span>'
        +'<span style="font-size:12px;color:'+t2.color+'">'+t2.icon+' '+p.mmr+'</span>';
      d.addEventListener('click',(function(pid){
        return function(){
          var tns=TEAMS.slice(0,teamCount).map(function(t){return t.n;});
          var cur=teamMap[pid], idx=cur?tns.indexOf(cur):-1;
          if(idx===-1)teamMap[pid]=tns[0];
          else if(idx<tns.length-1)teamMap[pid]=tns[idx+1];
          else delete teamMap[pid];
          renderSelect();
        };
      })(p.id));
    }
    sl.appendChild(d);
  });
  // 팀 미리보기
  if(matchType==='team') renderTeamPreview();
}

function renderTeamPreview(){
  var cols=teamCount<=2?'1fr 1fr':teamCount<=4?'1fr 1fr':'1fr 1fr 1fr';
  var g=el('tPreviewGrid');g.style.gridTemplateColumns=cols;g.innerHTML='';
  TEAMS.slice(0,teamCount).forEach(function(tc){
    var members=Object.keys(teamMap).filter(function(id){return teamMap[id]===tc.n;})
      .map(function(id){return players.find(function(p){return p.id===id;});}).filter(Boolean);
    var chips=members.map(function(p){
      return '<span class="tchip" style="background:'+tc.bg+';color:'+tc.c+'">'+p.name+'</span>';
    }).join('');
    var b=document.createElement('div');
    b.className='tbox';b.style.borderColor=tc.c+'33';
    b.innerHTML='<div class="tbtitle" style="color:'+tc.c+'">'+tc.e+' 팀 '+tc.n+'</div>'
      +'<div>'+(chips||'<span style="color:#a7a9be;font-size:11px">없음</span>')+'</div>';
    g.appendChild(b);
  });
}

// ── 게임 시작 ─────────────────────────────────────────────────

        +'<div class="sgrid">'
        +'<div><div class="ilbl">등수</div><input type="number" data-idx="'+idx+'" data-f="rank" min="1" max="'+selPlayers.length+'" placeholder=""></div>'
        +'<div><div class="ilbl">남은 점수</div><input type="number" data-idx="'+idx+'" data-f="rem" min="0" placeholder=""></div>'
        +'</div>';
      si.appendChild(d);
    });
  } else {
    var hint=document.createElement('div');hint.className='hintbox';
    hint.innerHTML='각 팀의 결과를 입력해주세요<br>등수: 1등 팀 = 1, 2등 팀 = 2 …';
    si.appendChild(hint);
    TEAMS.slice(0,teamCount).forEach(function(tc){
      var names=Object.keys(teamMap).filter(function(id){return teamMap[id]===tc.n;})
        .map(function(id){var p=players.find(function(x){return x.id===id;});return p?p.name:'';}).join(', ');
      var d=document.createElement('div');d.className='sic';d.style.borderLeft='3px solid '+tc.c;
      d.innerHTML='<div style="font-weight:700;margin-bottom:4px;color:'+tc.c+'">'+tc.e+' 팀 '+tc.n+'</div>'
        +'<div style="font-size:12px;color:#a7a9be;margin-bottom:10px">'+names+'</div>'
        +'<div class="sgrid">'
        +'<div><div class="ilbl">등수</div><input type="number" data-team="'+tc.n+'" data-f="rank" min="1" max="'+teamCount+'" placeholder=""></div>'
        +'<div><div class="ilbl">남은 점수</div><input type="number" data-team="'+tc.n+'" data-f="rem" min="0" placeholder=""></div>'
        +'</div>';

el('btnCancel').addEventListener('click',function(){
  el('vScore').style.display='none';
  el('vDone').style.display='none';
  el('vSelect').style.display='block';
  renderSelect();
});

// ── MMR 반영 ─────────────────────────────────────────────────
el('btnSubmit').addEventListener('click',function(){
  var changes={}, record;

  if(matchType==='solo'){
    var ri=el('scoreInputs').querySelectorAll('input[data-f="rank"]');
    var remi=el('scoreInputs').querySelectorAll('input[data-f="rem"]');
    for(var i=0;i<ri.length;i++){
      if(!ri[i].value.trim()||!remi[i].value.trim()){toast('모든 플레이어 점수를 입력해주세요!','#ff4444');return;}
    }
    var ranks=selPlayers.map(function(id,i){return {id:id,rank:Number(ri[i].value)};});
    var rem={}; selPlayers.forEach(function(id,i){rem[id]=remi[i].value;});
    var gps=selPlayers.map(function(id){return players.find(function(p){return p.id===id;});});

    // Elo 계산
    gps.forEach(function(p){changes[p.id]=0;});
    for(var a=0;a<gps.length;a++) for(var b=a+1;b<gps.length;b++){
      var pa=gps[a],pb=gps[b];
      var ra=ranks.find(function(r){return r.id===pa.id;}).rank;
      var rb=ranks.find(function(r){return r.id===pb.id;}).rank;
      var sa=ra<rb?1:ra===rb?0.5:0;
      var ea=1/(1+Math.pow(10,(pb.mmr-pa.mmr)/400));
      changes[pa.id]+=Math.round(32*(sa-ea));
      changes[pb.id]+=Math.round(32*((1-sa)-(1-ea)));
    }
    players=players.map(function(p){
      if(!changes.hasOwnProperty(p.id))return p;
      var isWin=ranks.find(function(r){return r.id===p.id;}).rank===1;
      return {id:p.id,name:p.name,mmr:Math.max(100,p.mmr+changes[p.id]),games:p.games+1,wins:p.wins+(isWin?1:0)};
    });
    record={id:Date.now(),type:'solo',mode:gameMode,date:new Date().toLocaleDateString('ko-KR'),
      players:gps.map(function(p){
        return {name:p.name,rank:ranks.find(function(r){return r.id===p.id;}).rank,remaining:rem[p.id],mmrChange:changes[p.id]};
      })};

  } else {
    var tns=TEAMS.slice(0,teamCount).map(function(t){return t.n;});
    var tRanks={},tRems={};
    for(var ti=0;ti<tns.length;ti++){
      var tn=tns[ti];
      var rv=el('scoreInputs').querySelector('input[data-team="'+tn+'"][data-f="rank"]');
      var rv2=el('scoreInputs').querySelector('input[data-team="'+tn+'"][data-f="rem"]');
      if(!rv||!rv.value.trim()||!rv2||!rv2.value.trim()){toast('팀 '+tn+' 점수를 입력해주세요!','#ff4444');return;}
      tRanks[tn]=Number(rv.value);tRems[tn]=rv2.value;
    }
    var tGroups=tns.map(function(tn){
      return {n:tn,players:Object.keys(teamMap).filter(function(id){return teamMap[id]===tn;})
        .map(function(id){return players.find(function(p){return p.id===id;});}).filter(Boolean)};
    });
    // 팀 Elo 계산
    tGroups.forEach(function(g){g.players.forEach(function(p){changes[p.id]=0;});});
    function avg(g){return g.players.reduce(function(s,p){return s+p.mmr;},0)/g.players.length;}
    for(var ai=0;ai<tGroups.length;ai++) for(var bi=ai+1;bi<tGroups.length;bi++){
      var ta=tGroups[ai],tb=tGroups[bi];
      var rra=tRanks[ta.n],rrb=tRanks[tb.n];
      var sa2=rra<rrb?1:rra===rrb?0.5:0;
      var ea2=1/(1+Math.pow(10,(avg(tb)-avg(ta))/400));
      ta.players.forEach(function(p){changes[p.id]+=Math.round(32*(sa2-ea2));});
      tb.players.forEach(function(p){changes[p.id]+=Math.round(32*((1-sa2)-(1-ea2)));});
    }
    var winRank=Math.min.apply(null,Object.values(tRanks));
    players=players.map(function(p){
      if(!changes.hasOwnProperty(p.id))return p;
      var myT=teamMap[p.id],isWin=tRanks[myT]===winRank;
      return {id:p.id,name:p.name,mmr:Math.max(100,p.mmr+changes[p.id]),games:p.games+1,wins:p.wins+(isWin?1:0)};
    });
    var allP=[];
    tGroups.forEach(function(g){
      g.players.forEach(function(p){
        allP.push({name:p.name,team:g.n,rank:tRanks[g.n],remaining:tRems[g.n],mmrChange:changes[p.id]});
      });
    });
    record={id:Date.now(),type:'team',teamCount:teamCount,mode:gameMode,date:new Date().toLocaleDateString('ko-KR'),
      teamRanks:tRanks,players:allP};
  }

  history.unshift(record);
  renderRanking();

  // 결과 화면 표시
  var sortedP=record.players.slice().sort(function(a,b){return a.rank-b.rank;});
  var doneRowsEl=el('doneRows');doneRowsEl.innerHTML='';
  sortedP.forEach(function(p){
    var tc3=record.type==='team'?TEAMS.find(function(t){return t.n===p.team;}):null;
    var nameHtml=tc3
      ?'<span class="tbdg" style="background:'+tc3.bg+';color:'+tc3.c+'">팀 '+tc3.n+'</span> '+p.name
      :(p.rank===1?'🥇':p.rank===2?'🥈':p.rank===3?'🥉':'🎯')+' '+p.name;
    var dr=document.createElement('div');dr.className='drow';
    dr.innerHTML='<span>'+nameHtml+'</span>'
      +'<span style="font-weight:800;color:'+(p.mmrChange>=0?'#00e676':'#ff4444')+'">'+(p.mmrChange>=0?'+':'')+p.mmrChange+' MMR</span>';
    doneRowsEl.appendChild(dr);
  });
  var dw=el('doneWin');
  if(record.type==='team'){
    var wr=Math.min.apply(null,Object.values(record.teamRanks));
    var ws=Object.keys(record.teamRanks).filter(function(t){return record.teamRanks[t]===wr;});
    dw.textContent=ws.length>1?'🤝 무승부!':'🏆 팀 '+ws[0]+' 승리!';
    dw.style.display='block';
  } else {
    dw.style.display='none';
  }
  el('vScore').style.display='none';
  el('vDone').style.display='block';

  // Firebase 저장
  selPlayers=[];teamMap={};
  syncUI('syncing');
  Promise.all([savePlayers(),saveHist(record)])
    .then(function(){syncUI('ok');toast('저장 완료! ☕🔥','#00e676');})
    .catch(function(){syncUI('err');toast('저장 실패!','#ff4444');});
});

  el('teamOpts').style.display='block';el('tPreviewCard').style.display='block';

// ── 선수 등록/삭제 ───────────────────────────────────────────
el('btnAdd').addEventListener('click',addPlayer);
el('newName').addEventListener('keydown',function(e){if(e.key==='Enter')addPlayer();});

function addPlayer(){
  var name=el('newName').value.trim();
  if(!name)return;
  if(players.find(function(p){return p.name===name;})){toast('이미 있는 이름이에요!','#ff4444');return;}
  var np={id:String(Date.now()),name:name,mmr:1000,games:0,wins:0};
  players.push(np);el('newName').value='';renderPlayers();
  savePlayers().then(function(){toast(name+' 등록 완료! 🎯','#00e676');})
    .catch(function(){toast(name+' 등록됨 (저장 실패)','#ffd700');});
}

function renderPlayers(){
  var pl=el('pList');pl.innerHTML='';
  players.forEach(function(p){
    var t=tier(p.mmr),wr=p.games>0?Math.round(p.wins/p.games*100):0;
    var d=document.createElement('div');d.className='pcard';
    d.innerHTML='<div style="font-size:24px">'+t.icon+'</div>'
      +'<div class="pinfo"><div class="pname">'+p.name+'</div>'
        +'<div class="pstat">'+p.games+'전 '+p.wins+'승 '+(p.games-p.wins)+'패 · 승률 '+wr+'%</div></div>'
      +'<div class="pmmr"><div class="pmmrv" style="color:'+t.color+'">'+p.mmr+'</div>'
        +'<div class="pmmrt" style="color:'+t.color+';background:'+t.color+'22">'+t.name+'</div></div>'
      +'<button class="delbtn">🗑️</button>';
    d.querySelector('.delbtn').addEventListener('click',(function(pid,pname){
      return function(){
        if(!confirm('"'+pname+'" 삭제할까요?\n전적/MMR이 사라져요.'))return;
        players=players.filter(function(x){return x.id!==pid;});
        selPlayers=selPlayers.filter(function(x){return x!==pid;});
        delete teamMap[pid];
        renderPlayers();
        savePlayers().then(function(){toast(pname+' 삭제 완료','#ff4444');})
          .catch(function(){toast('삭제됨 (저장 실패)','#ffd700');});
      };
    })(p.id,p.name));
    pl.appendChild(d);
  });
}

// ── 기록 ─────────────────────────────────────────────────────
function renderHistory(){
  var hl=el('hList');hl.innerHTML='';
  if(!history.length){hl.innerHTML='<div class="empty">📋<br><br>아직 기록된 게임이 없어요</div>';return;}
  history.forEach(function(g){
    var isTeam=g.type==='team';
    var d=document.createElement('div');d.className='hcard';
    var modeTag=g.mode+(isTeam?' '+(g.teamCount||2)+'팀전':'');
    var winBadge='';
    if(isTeam&&g.teamRanks){
      var wr2=Math.min.apply(null,Object.values(g.teamRanks));
      var ws2=Object.keys(g.teamRanks).filter(function(t){return g.teamRanks[t]===wr2;});
      winBadge=ws2.length>1?'<span style="font-size:10px;color:#a7a9be;margin-left:4px">무승부</span>'
        :'<span style="font-size:10px;font-weight:700;color:#ffd700;margin-left:4px">팀 '+ws2[0]+' 승</span>';
    }
    var rows=g.players.slice().sort(function(a,b){return a.rank-b.rank;}).map(function(p){
      var tc4=isTeam?TEAMS.find(function(t){return t.n===p.team;}):null;
      var nameCell=tc4
        ?'<span class="tbdg" style="background:'+tc4.bg+';color:'+tc4.c+'">'+tc4.n+'</span> '+p.name
        :(p.rank===1?'🥇':p.rank===2?'🥈':p.rank===3?'🥉':'🎯')+' '+p.name;
      return '<div class="hrow"><span style="flex:1;font-weight:600">'+nameCell+'</span>'
        +'<span style="font-size:12px;color:#a7a9be">남은 '+p.remaining+'점</span>'
        +'<span style="font-weight:800;font-size:13px;color:'+(p.mmrChange>=0?'#00e676':'#ff4444')+';min-width:55px;text-align:right">'+(p.mmrChange>=0?'+':'')+p.mmrChange+'</span></div>';
    }).join('');
    d.innerHTML='<div class="hhead"><span class="hmode">'+modeTag+'</span>'+winBadge
      +'<span style="font-size:11px;color:#a7a9be">'+g.date+'</span></div>'+rows;
    hl.appendChild(d);
  });
}

// ── 토스트 ────────────────────────────────────────────────────
var tTimer;
function toast(msg,color){
  var t=el('toast');t.textContent=msg;t.style.background=color||'#00e676';t.style.display='block';
  clearTimeout(tTimer);tTimer=setTimeout(function(){t.style.display='none';},2800);
}
